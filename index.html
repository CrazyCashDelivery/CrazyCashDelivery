<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171717">
<title>Crazy Cash Delivery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f7;color:#222;font-family:Arial,sans-serif}
header{background:#171717;color:white;padding:22px 18px}
.logo{color:#ffad25;font-size:25px;font-weight:900}
.tagline{color:#ddd;margin-top:7px;font-size:14px}
main{padding:20px;max-width:600px;margin:auto}
h1{font-size:27px;margin:8px 0 18px}
.search{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px}
h2{font-size:19px;margin-top:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.category{background:white;border-radius:15px;padding:20px 14px;box-shadow:0 2px 9px #0000000d;border:1px solid #eee;text-align:left;cursor:pointer}
.category span{display:block;font-size:30px;margin-bottom:10px}
.category strong{font-size:16px}
.category small{display:block;color:#777;margin-top:6px}
.banner{background:#211b13;color:white;border-radius:15px;padding:22px;margin-top:24px}
.banner strong{color:#ffad25;font-size:21px}
button{font-family:inherit}
footer{background:#171717;color:#ddd;text-align:center;padding:20px;margin-top:35px;font-size:13px}
.cart{background:#ffad25;border:0;border-radius:12px;padding:13px 18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="logo">🛍️ CRAZY CASH</div>
<div class="tagline">Anything you need. Delivered.</div>
</header>
<main>
<h1>What do you need delivered?</h1>
<input class="search" id="search" placeholder="Search food, groceries, stores..." oninput="filterCategories()">
<h2>Shop by category</h2>
<div class="grid" id="categories">
<button class="category" onclick="choose('Food')"><span>🍔</span><strong>Food</strong><small>Restaurants & takeout</small></button>
<button class="category" onclick="choose('Groceries')"><span>🛒</span><strong>Groceries</strong><small>Everyday essentials</small></button>
<button class="category" onclick="choose('Packages')"><span>📦</span><strong>Packages</strong><small>Local deliveries</small></button>
<button class="category" onclick="choose('Convenience')"><span>🏪</span><strong>Convenience</strong><small>Local stores</small></button>
</div>
<div class="banner">
<strong>Crazy Cash Delivery</strong>
<p>Local service. Convenient delivery. Made for you.</p>
<button class="cart" onclick="alert('Your shopping experience is coming soon!')">Start shopping →</button>
</div>
</main>
<footer>© 2026 Crazy Cash Delivery. All rights reserved.</footer>
<script>
function choose(category){alert(category+' selected! Online ordering is coming soon.')}
function filterCategories(){
let term=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.category').forEach(card=>{
card.style.display=card.innerText.toLowerCase().includes(term)?'block':'none';
});
}
</script>
</body>
</html>
